<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <title>Scenario 01 · VR180</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="vr-view" aria-label="Interactive VR180 scenario view"></canvas>
    <div class="viewer-grade"></div>
    <header class="topbar">
      <a class="brand" href="/">◉ <b>INATTENTIVE ROBOT</b> · VR180</a>
      <div class="scenario-meta"><strong>01 · Kitchen or Care?</strong><span>Ongoing task vs. emergency</span></div>
      <span class="mode">DEPTH STEREO · 180°</span>
    </header>
    <button id="start-scene" class="center-action">▶ Play VR180 scenario</button>
    <footer class="viewer-footer">
      <div class="progress">
        <p><span id="viewer-status">LOADING VR180</span> · <span id="time-label">0.0 / 15.0s</span></p>
        <div><i id="progress-fill"></i></div>
      </div>
      <div class="vr-controls">
        <a href="/" id="back-scenarios" aria-label="Return to the scenario library">← Scenarios</a>
        <button id="enter-vr" type="button">Checking headset…</button>
      </div>
      <p class="technical">Drag to look around<span>Quest: depth-enhanced stereo</span></p>
    </footer>
    <script type="module" src="./viewer.js?v=h3upscale1"></script>
  </body>
</html>
